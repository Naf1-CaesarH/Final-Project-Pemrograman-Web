<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — Portal Desa Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./assets/tailwind-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./assets/style.css">

  <!-- React & ReactDOM via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-base font-sans text-t1 flex flex-col min-h-screen justify-between">

  <header class="p-6">
    <div class="flex items-center gap-2 max-w-md mx-auto">
      <div class="w-7 h-7 rounded-lg bg-brand flex items-center justify-center flex-shrink-0">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
          <rect x="2" y="8" width="5" height="6" rx="1" fill="white" />
          <rect x="9" y="5" width="5" height="9" rx="1" fill="white" opacity=".7" />
          <path d="M1 8L8 3L15 8" stroke="white" stroke-width="1.3" stroke-linecap="round" />
        </svg>
      </div>
      <div class="text-[13px] font-semibold text-t1 leading-tight">Portal Desa<br>Digital</div>
    </div>
  </header>

  <!-- Root element for React -->
  <div id="root" class="flex-1 flex flex-col"></div>

  <footer class="p-6 text-center text-[11px] text-t3">
    &copy; 2026 Portal Desa Digital. Hak Cipta Dilindungi.
  </footer>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function LoginApp() {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [remember, setRemember] = useState(false);
      const [isLoading, setIsLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      const usernameInputRef = useRef(null);

      // Effect: Auto-focus pada input username saat pertama kali dimuat
      useEffect(() => {
        if (usernameInputRef.current) {
          usernameInputRef.current.focus();
        }
      }, []);

      const handleLogin = (event) => {
        event.preventDefault();
        setErrorMsg('');

        if (!username || !password) {
          setErrorMsg('Username dan password harus diisi.');
          return;
        }

        setIsLoading(true);

        // Simulasi network request dengan timeout
        setTimeout(() => {
          const userLower = username.toLowerCase();

          // Mengarahkan ke folder yang tepat berdasarkan input
          if (userLower.includes('admin')) {
            window.location.href = 'admin/dashboard-admin.html';
          } else if (userLower.includes('rt')) {
            window.location.href = 'rt/dashboard-rt.html';
          } else {
            window.location.href = 'warga/dashboard.html'; // Default ke warga
          }
        }, 1000);
      };

      return (
        <main className="flex-1 flex items-center justify-center px-4 py-8">
          <section className="w-full max-w-md bg-surface border border-border rounded-2xl p-6 shadow-sm">
            <div className="mb-6">
              <h1 className="text-[20px] font-bold text-t1 tracking-tight">Selamat Datang</h1>
              <p className="text-[13px] text-t2 mt-1">Silakan masuk menggunakan akun warga Anda untuk mengakses dashboard.</p>
            </div>

            {/* Conditional Rendering untuk Error Message */}
            {errorMsg && (
              <div className="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-[12px] rounded-lg">
                {errorMsg}
              </div>
            )}

            <form onSubmit={handleLogin} className="flex flex-col gap-4">
              <div>
                <label htmlFor="username" className="block text-[12px] font-semibold text-t2 mb-1.5">NIK / Nama Pengguna</label>
                <input
                  type="text"
                  id="username"
                  name="username"
                  required
                  placeholder="Masukkan NIK atau username"
                  value={username}
                  onChange={(e) => setUsername(e.target.value)}
                  ref={usernameInputRef}
                  disabled={isLoading}
                  className="w-full text-[13px] px-3 py-2 border border-border rounded-xl focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand bg-base/50 disabled:opacity-50"
                />
              </div>

              <div>
                <div className="flex justify-between items-center mb-1.5">
                  <label htmlFor="password" className="block text-[12px] font-semibold text-t2">Kata Sandi</label>
                  <a href="#" className="text-[11px] text-brand hover:underline">Lupa sandi?</a>
                </div>
                <input
                  type="password"
                  id="password"
                  name="password"
                  required
                  placeholder="••••••••"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  disabled={isLoading}
                  className="w-full text-[13px] px-3 py-2 border border-border rounded-xl focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand bg-base/50 disabled:opacity-50"
                />
              </div>

              <div className="flex items-center gap-2 my-1">
                <input
                  type="checkbox"
                  id="remember"
                  checked={remember}
                  onChange={(e) => setRemember(e.target.checked)}
                  disabled={isLoading}
                  className="w-4 h-4 rounded border-border text-brand focus:ring-brand"
                />
                <label htmlFor="remember" className="text-[12px] text-t2 select-none">Ingat saya di perangkat ini</label>
              </div>

              <button
                type="submit"
                disabled={isLoading}
                className="w-full bg-brand hover:bg-brand-dark text-white text-[13px] font-semibold py-2.5 px-4 rounded-xl transition-colors duration-200 shadow-sm mt-2 disabled:opacity-70 flex justify-center items-center gap-2"
              >
                {isLoading ? (
                  <React.Fragment>
                    <svg className="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                      <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                      <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Memproses...
                  </React.Fragment>
                ) : (
                  'Masuk Sekarang'
                )}
              </button>
            </form>

            <div className="mt-6 pt-4 border-t border-border text-center">
              <p className="text-[12px] text-t3">Belum memiliki akun warga? <a href="#" className="text-brand font-medium hover:underline">Hubungi RT/RW Setempat</a></p>
            </div>

          </section>
        </main>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<LoginApp />);
  </script>

</body>

</html>
